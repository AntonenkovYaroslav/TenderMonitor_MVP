{% extends "base.html" %}
{% block title %}Смена пароля — Tender Monitor{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Смена пароля</h1>
  <p class="muted">Пользователь: {{ user['login'] }} ({{ role_labels[user['role']] }})</p>
  <form method="post" action="{{ url_for('web.account_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Текущий пароль<input type="password" name="current_password" required></label>
    <label>Новый пароль<input type="password" name="new_password" minlength="6" required></label>
    <label>Повторите новый пароль<input type="password" name="repeat_password" minlength="6" required></label>
    <button type="submit" class="primary">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
