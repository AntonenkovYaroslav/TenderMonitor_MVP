{% extends "base.html" %}
{% block title %}Вход — Tender Monitor{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Tender Monitor</h1>
  <p class="muted">Локальная админ-панель мониторинга закупок ЕИС</p>
  <form method="post" action="{{ url_for('web.login') }}{% if next_target %}?next={{ next_target }}{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Логин<input type="text" name="login" autofocus required></label>
    <label>Пароль<input type="password" name="password" required></label>
    <button type="submit" class="primary">Войти</button>
  </form>
</div>
{% endblock %}
